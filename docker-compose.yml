services:
  app:
    build: .
    image: velmo-v2
    env_file:
      - .env
    environment:
      CHROMA_URL: http://chroma:8000
      OLLAMA_URL: http://ollama:11434
      # Construit à partir des mêmes variables que le service postgres (source
      # unique .env, D6-10/D10-09) — plus de credentials littéraux dupliqués.
      DB_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-velmo}
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    # L'image lance uvicorn par défaut (CMD du Dockerfile) — pas d'override ici,
    # workload identique image ↔ compose. Ouvrir la CLI avec :
    #   docker compose exec app python -m velmo.cli
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    # Tag lisible + digest immuable (D6-04).
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-velmo}
    ports:
      - "5432:5432"
    volumes:
      - .docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-velmo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    # Pinné par digest (D6-04) — image validée en test, plus de `:latest` mutable.
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    ports:
      - "8001:8000"
    volumes:
      - .docker-data/chroma:/chroma/chroma
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    # Pinné par digest (D6-04).
    image: ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0
    ports:
      - "11434:11434"
    volumes:
      - .docker-data/ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ollama serve &
        sleep 3 &&
        ollama pull llama-guard3:8b &&
        echo "llama-guard3:8b pulled" &&
        wait
    healthcheck:
      # `ollama list` réussit dès que le daemon répond (avant même la fin du
      # pull) — la garde vaut « serveur prêt », pas « modèle téléchargé ».
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: ./web
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    command: pnpm dev
    depends_on:
      - app
