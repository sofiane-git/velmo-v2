name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        # --all-extras : environnement mypy stable — sans les extras, les
        # imports optionnels (anthropic, langfuse, deepeval…) rendent le
        # résultat mypy dépendant de l'env (cf. audit B6).
        run: uv sync --locked --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Format (ruff)
        run: uv run ruff format --check src tests

      - name: Typage strict (mypy)
        run: uv run mypy src

      - name: Vérifie les contrats d'imports (isolation mémoire)
        run: uv run lint-imports --config pyproject.toml

      - name: Acceptance suite
        run: uv run pytest tests/acceptance/ -v

      - name: Quality gate
        run: uv run python -m velmo.mlops.score --min-score 0.8
