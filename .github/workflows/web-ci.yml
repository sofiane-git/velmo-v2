name: web-ci

on:
  push:
    branches: [main]
    paths: ["web/**"]
  pull_request:
    paths: ["web/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          # `defaults.run.working-directory: web` ne s'applique qu'aux steps
          # `run:`, pas à cette action — sans ce chemin explicite, elle
          # cherche `packageManager` dans un package.json à la racine du
          # repo (inexistant), pas dans web/package.json.
          package_json_file: web/package.json

      - name: Install node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck
