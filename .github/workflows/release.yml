name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # Gate hybride (audit B4) : contrairement au gate par-PR (quality.yml,
    # mode dégradé déterministe), le gate de release évalue le VRAI modèle
    # avec les secrets applicatifs, et persiste sa baseline dans le Postgres
    # partagé (audit B5). Secrets à poser une fois :
    #   gh secret set DB_URL --body "postgresql+psycopg://velmo_app:...@<srv>.postgres.database.azure.com:5432/velmo"
    #   gh secret set AZURE_AI_INFERENCE_ENDPOINT / AZURE_AI_INFERENCE_API_KEY
    #   gh secret set AZURE_OPENAI_GUARD_ENDPOINT / AZURE_OPENAI_GUARD_API_KEY
    #   gh secret set ANTHROPIC_FOUNDRY_ENDPOINT / ANTHROPIC_API_KEY
    env:
      DB_URL: ${{ secrets.DB_URL }}
      AZURE_AI_INFERENCE_ENDPOINT: ${{ secrets.AZURE_AI_INFERENCE_ENDPOINT }}
      AZURE_AI_INFERENCE_API_KEY: ${{ secrets.AZURE_AI_INFERENCE_API_KEY }}
      AZURE_OPENAI_GUARD_ENDPOINT: ${{ secrets.AZURE_OPENAI_GUARD_ENDPOINT }}
      AZURE_OPENAI_GUARD_API_KEY: ${{ secrets.AZURE_OPENAI_GUARD_API_KEY }}
      ANTHROPIC_FOUNDRY_ENDPOINT: ${{ secrets.ANTHROPIC_FOUNDRY_ENDPOINT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv python install 3.11
      - run: uv sync --locked
      - name: Garde anti-silence — le gate release NE DOIT PAS évaluer le stub
        # Sans ce garde, secrets absents => repli EchoLLM/SQLite silencieux :
        # exactement les findings B4/B5 de l'audit, de retour sans bruit.
        run: |
          if [ -z "$AZURE_AI_INFERENCE_API_KEY" ]; then
            echo "::error::AZURE_AI_INFERENCE_API_KEY absent — le gate release évaluerait le stub (audit B4)."
            exit 1
          fi
          if [ -z "$DB_URL" ]; then
            echo "::error::DB_URL absent — baseline de non-régression non persistante (audit B5)."
            exit 1
          fi
      - name: Migrations Alembic — Postgres, unique source du schéma (D2-04/D7-17)
        # Base historique créée par create_all avant ce câblage (jamais stampée) :
        # si les tables applicatives existent sans alembic_version, stamp head une
        # fois (schéma create_all == schéma head, vérifié) ; sinon chaîne normale.
        run: |
          if uv run python -c "import os,sys,sqlalchemy as sa; insp=sa.inspect(sa.create_engine(os.environ['DB_URL'])); sys.exit(0 if insp.has_table('customers') and not insp.has_table('alembic_version') else 1)"; then
            uv run alembic stamp head
          fi
          uv run alembic upgrade head
      - name: 3 suites contre le tag (gate bloquant, vrai modèle)
        run: uv run python -m velmo.mlops.score --triggered-by ci

  approve-and-promote:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      id-token: write   # azure/login OIDC (déploiement ACA)

    # GitHub Environment "production" : configurer les required reviewers dans
    # Settings → Environments → production (geste manuel unique du cycle
    # normal, cf. conception_chantier3_evaluation_mlops.md §Boucle qualité).
    # SPOF assumé en équipe solo (voir Décisions de conception, Ch.3) : un
    # seul reviewer aujourd'hui, à étendre dès qu'une 2e personne rejoint.
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          # Identité dédiée au déploiement (distincte de celle de nightly.yml,
          # Reader seul) — federated credential scopée à l'Environment
          # `production` (subject `repo:...:environment:production`), pas à un
          # tag ni une branche : la confiance Azure colle exactement au clic
          # d'approbation humaine ci-dessus. Mise en place ponctuelle :
          # tuto_github_actions_release.md §4bis.
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build + push l'image (ACR, tag = version du tag release)
        env:
          ACR: ${{ vars.AZURE_ACR_NAME }}
          TAG_NAME: ${{ github.ref_name }}
        run: az acr build --registry "$ACR" --image "velmo:$TAG_NAME" --file Dockerfile .
      - name: Déploie l'image sur Azure Container Apps
        env:
          ACR: ${{ vars.AZURE_ACR_NAME }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          az containerapp update --name "$APP" --resource-group "$RG" \
            --image "${ACR}.azurecr.io/velmo:${TAG_NAME}"
      - name: Vérifie /health sur la nouvelle révision
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
        run: |
          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 10); do
            curl -fsS "https://$FQDN/health" && exit 0
            sleep 5
          done
          echo "::error::$FQDN/health ne répond pas 200 après déploiement — rollback manuel : az containerapp update --image ...:<version précédente>"
          exit 1
      - name: Marque le tag comme promu (GitHub Release, après déploiement vérifié)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Velmo 2.0 $TAG_NAME" \
            --notes "Promu en production après gate qualité vert + déploiement ACA vérifié (voir mlops/report.md du run CI associé)."
