[project]
name = "velmo-v2"
version = "2.0.0"
description = "Velmo 2.0 — agent de support pour une boutique de maillots de foot collector (mémoire, garde-fous, MLOps)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.1,<3.3",
    "alembic>=1.13,<2",
    "fastapi>=0.110.0,<1",
    "uvicorn>=0.27.0,<1",
]

[project.optional-dependencies]
# Mémoire long terme épisodique ET KB FAQ (`velmo.kb_store.PgVectorKB`) :
# embeddings stockés dans PostgreSQL via pgvector, même Postgres, même modèle
# (voir conception_chantier1_memoire.md §Store épisodique). LocalEpisodic/LocalKB
# (mots-clés) restent les replis hors-ligne.
vector = [
    "pgvector>=0.5,<0.6",
    "sentence-transformers>=3,<4",
]
# LLM via Azure AI Inference (Kimi-K2.6).
llm = [
    "langchain>=1.2,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-azure-ai>=1.0,<2.0",
    "azure-ai-inference>=1.0.0b9",
]
# Garde-fous : classifieur de modération local + juge/Prompt Shields/PII Azure.
guardrails = [
    "pyyaml>=6,<7",
    "requests>=2,<3",
    "openai>=1.50,<3",
    "azure-ai-contentsafety>=1.0,<2",
    "azure-ai-textanalytics>=5.3,<6",
]
# Orchestration du tour + persistance de thread (remplace les tables maison
# Conversation/Message — voir docs/reference/conceptions/conception_chantier1_memoire.md).
graph = [
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.1,<3.2",
    "langgraph-checkpoint-sqlite>=3.1,<3.2",
]
# Observabilité (Chantier 3) : Langfuse self-host, hors chemin de gate —
# optionnel, repli NullSink sans config (voir Task 5, get_sink()).
observability = [
    "langfuse>=4,<5",
]
# Suite Qualité (Chantier 3) : DeepEval, cadré (métriques qualité seule, juge
# Claude via Azure AI Foundry pinné) — optionnel, repli déterministe
# (SubstringScorer) sans Foundry configuré.
# >=4 requis : deepeval 2.x/3.x importent `langchain.schema` (API supprimée
# dans langchain 1.x, déjà pinné par l'extra `llm`) ; deepeval 4.x a retiré
# la dépendance langchain.
eval = [
    "deepeval>=4,<5",
]
# Extracteur mémoire (Chantier 1) + juge DeepEval Qualité (Chantier 3) :
# claude-opus-4-5 via Azure AI Foundry (`AnthropicFoundry`), déploiement
# partagé — voir Settings.anthropic_foundry_endpoint.
anthropic = [
    "anthropic>=0.60,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<0.10",
    "mypy>=1.10,<2",
    "import-linter>=2.13,<2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velmo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# deepeval (extra `eval`, Task 4) s'auto-enregistre comme plugin pytest et
# appelle `autoload_dotenv()` à l'import, ce qui charge le `.env` réel du
# poste (Azure, etc.) dans os.environ pour TOUTE la session de test — on
# n'utilise jamais l'intégration pytest propre à DeepEval (juste ses classes
# AzureOpenAIModel/GEval/LLMTestCase en direct dans DeepEvalScorer).
addopts = "-p no:deepeval"

[tool.importlinter]
root_package = "velmo"

[[tool.importlinter.contracts]]
name = "Isolation mémoire : db.py non-contournable"
type = "forbidden"
source_modules = [
    "velmo.agent",
    "velmo.api",
    "velmo.cli",
    "velmo.db",
    "velmo.kb_store",
    "velmo.guardrails",
    "velmo.mlops",
    "velmo.tools",
]
forbidden_modules = ["velmo.memory.db"]
# Seuls les imports directs de velmo.memory.db sont interdits ; passer par
# l'API publique velmo.memory (qui importe .db en interne) reste légitime —
# sans ce réglage, le contrat casserait aussi l'usage normal de MemoryManager.
allow_indirect_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["langchain_azure_ai.*", "yaml", "azure.ai.textanalytics.*"]
ignore_missing_imports = true

# Torch CPU-only : évite libtorch_cuda.so (~2GB, inutile en inférence sentence-transformers).
# uv résout `torch` depuis cet index lors de `uv lock` → le wheel CPU est fixé dans uv.lock.
# Aucun changement Dockerfile requis : `uv sync` lira simplement le lockfile.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
